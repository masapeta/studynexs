[project]
name = "studynexs-api"
version = "1.0.0"
description = "StudyNexs School Management Platform — API"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",  # For Alembic sync operations
    # ── Validation ──
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # ── Auth & Security ──
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=4.0.0",
    # ── Redis ──
    "redis[hiredis]>=5.0.0",
    # ── HTTP Client ──
    "httpx>=0.27.0",
    # ── Logging ──
    "structlog>=24.0.0",
    # ── Async Task Queue ──
    "arq>=0.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "faker>=25.0.0",
    "psutil>=6.0.0",
    "locust>=2.0.0",
]
ai = [
    # Provider SDKs for the LLM gateway (lazy-imported; install with: pip install -e ".[ai]")
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "google-genai>=0.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*", "scripts*"]
