name: CI

# Quality gates for StudyNexs (constitution §69). Runs on every PR and on pushes to the
# long-lived branches. Tests + build + image are the HARD gates. Lint (ruff, eslint) runs
# report-only — lint/formatting is normal engineering hygiene done incrementally as code is
# touched, not a merge-blocking milestone (owner direction). A dedicated, isolated formatting
# pass can flip these to blocking later.

on:
  push:
    branches: [phase-0-foundation, main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint · tests (guards on)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studynexs
          POSTGRES_PASSWORD: studynexs_dev
          POSTGRES_DB: studynexs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U studynexs"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      # Same pin as infra/docker/docker-compose.dev.yml; readiness is checked from the runner.
      qdrant:
        image: qdrant/qdrant:v1.18.3@sha256:0bd98fa7977f1e75694779359ca4e212822e5a71334e28421182f72f209d5286
        ports: ["6333:6333"]
    env:
      ENVIRONMENT: testing
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: studynexs
      POSTGRES_PASSWORD: studynexs_dev
      POSTGRES_DB: studynexs
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install (with dev + ai + observability + rag extras, matching the API image)
        run: pip install -e ".[dev,ai,observability,rag]"
      - name: Runtime provenance — `app` must come from THIS repo (audit P0-ENV-001)
        run: pytest tests/test_canonical_runtime.py -q -p no:cacheprovider
      - name: Lint (ruff) — report-only (incremental hygiene, not a merge gate)
        continue-on-error: true
        run: ruff check .
      - name: Wait for Qdrant readiness
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready" >&2
          exit 1
      - name: Tests — main suite (FakeRedis, tenant/RBAC/money/AI)
        run: pytest -q -p no:cacheprovider
      - name: Tests — security suite (middleware + tenant match + rate limits ON, real Redis)
        env:
          ENVIRONMENT: development
          RATE_LIMIT_ENABLED: "true"
          LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "1000"
        run: pytest tests_security -q -p no:cacheprovider

  web:
    name: Web — lint · types · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin-web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint (eslint) — report-only until the lint backlog is cleared
        continue-on-error: true
        run: npm run lint
      - name: Build (next build — also type-checks)
        run: npm run build

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API container image
        run: docker build -t studynexs-api:ci apps/api
