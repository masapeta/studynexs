global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # In-process AI metrics (works with or without OTel)
  - job_name: studynexs-api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  # OpenTelemetry metrics (HTTP auto-instrumentation + AI OTel bridge)
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

rule_files:
  - /etc/prometheus/alerts.yml
