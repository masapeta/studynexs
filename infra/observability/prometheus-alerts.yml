groups:
  - name: studynexs_platform
    rules:
      - alert: StudyNexsAPIDown
        expr: up{job="studynexs-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "StudyNexs API metrics target is down"
          description: "Prometheus cannot scrape the StudyNexs API /metrics endpoint."

      - alert: StudyNexsHTTP5xxHigh
        expr: sum(rate(studynexs_http_requests_total{status_class="5xx"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "StudyNexs API is returning 5xx responses"
          description: "One or more API routes have returned 5xx responses for 5 minutes."

      - alert: StudyNexsJobStatusScrapeError
        expr: studynexs_job_status_scrape_error > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "StudyNexs job status metrics cannot be scraped"
          description: "The API could not read job status from the database while rendering /metrics."

      - alert: StudyNexsFailedJobBacklog
        expr: studynexs_job_status_current{status="failed"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "StudyNexs has failed background jobs"
          description: "Failed jobs are present for task {{ $labels.task }}."

      - alert: StudyNexsStaleJobBacklog
        expr: studynexs_job_status_oldest_age_seconds{status=~"queued|running"} > 1800
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "StudyNexs has stale queued/running background jobs"
          description: "Oldest {{ $labels.status }} job for {{ $labels.task }} is older than 30 minutes."

      # Question-paper generation is the slowest real job and is user-visible in chat; alert at the
      # stuck-job sweep's own thresholds (JOB_QUEUED_STUCK_SECONDS=300 / JOB_RUNNING_STUCK_SECONDS=900)
      # so a down/crashed worker is caught well before the generic 30-min backlog rule. Uses the
      # existing DB-backed job-status gauge — no new metric.
      - alert: StudyNexsQPJobStuckQueued
        expr: studynexs_job_status_oldest_age_seconds{task="question_paper_generate",status="queued"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Question paper jobs stuck queued"
          description: "A question_paper_generate job has been queued >5m — the Arq worker may be down or backlogged."

      - alert: StudyNexsQPJobStuckRunning
        expr: studynexs_job_status_oldest_age_seconds{task="question_paper_generate",status="running"} > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Question paper jobs stuck running"
          description: "A question_paper_generate job has been running >15m — the worker likely crashed mid-generation."

  - name: studynexs_ai
    rules:
      - alert: AI_LLM_ErrorRateHigh
        expr: |
          sum(rate(studynexs_ai_llm_requests_total{status="error"}[5m]))
          /
          sum(rate(studynexs_ai_llm_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI LLM error rate above 10%"
          description: "More than 10% of LLM calls are failing over the last 5 minutes."

      - alert: AI_LLM_FallbackSpike
        expr: sum(rate(studynexs_ai_llm_fallback_success_total[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI fallback provider usage spike"
          description: "Primary LLM provider may be degraded; Ollama fallback is active."

      - alert: AI_LLM_LatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(studynexs_ai_llm_latency_seconds_bucket[5m])) by (le, feature)
          ) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AI LLM p95 latency above 30s"
          description: "Feature {{ $labels.feature }} LLM p95 latency is high."
