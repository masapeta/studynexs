events {
    worker_connections 1024;
}

http {
    client_max_body_size 12m;

    # Do not advertise the nginx version in headers/error pages.
    server_tokens off;

    # ── Security headers (every response, including errors) ─────
    # This is a JSON API behind a gateway: framing is never legitimate,
    # sniffing is never needed, and no referrer should leak resource URLs.
    # HSTS only when the request arrived over TLS (the Cloudflare edge sets
    # X-Forwarded-Proto=https); nginx omits headers with empty values, so
    # plain-HTTP local verification never receives a bogus HSTS pin.
    map $http_x_forwarded_proto $hsts_value {
        default "";
        https   "max-age=31536000; includeSubDomains";
    }

    # ── Rate Limiting ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/m;
    limit_req_status 429;

    upstream api {
        server api:8000;
    }

    server {
        listen 80;
        server_name _;

        # `always` so 4xx/5xx responses carry them too.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # API responses are data, not documents; a restrictive CSP defuses
        # any HTML-ish payload a browser is tricked into rendering.
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security $hsts_value always;

        # ── Auth endpoints (strict rate limiting) ────────────────
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API endpoints (standard rate limiting) ───────────────
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health check (no rate limit) ─────────────────────────
        location /health {
            proxy_pass http://api;
        }

        location /ready {
            proxy_pass http://api;
        }

        # Metrics stay token-gated by the app; never expose to the internet —
        # scrape over the Docker network (prometheus.prod.yml targets api:8000).
        location /metrics {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
            proxy_pass http://api;
        }
    }
}
